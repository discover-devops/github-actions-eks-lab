name: CI-CD to EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USER: discoverdevops
  IMAGE_NAME: discoverdevops/eks-demo-app
  IMAGE_TAG: ${{ github.run_number }}
  CLUSTER_NAME: gha-eks-lab
  AWS_REGION: ap-south-1
  SONAR_URL: http://localhost:9000

jobs:
  build-deploy-scan:
    runs-on: [self-hosted, eks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest ./app

      - name: Push image to Docker Hub
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION
          kubectl get nodes

      - name: Deploy to EKS
        run: |
          sed -e "s|__IMAGE__|$IMAGE_NAME:$IMAGE_TAG|" \
              -e "s|__VERSION__|v$IMAGE_TAG|" \
              k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/eks-demo-app --timeout=180s

      - name: Show deployment status
        run: |
          kubectl get deploy,pods,svc -o wide

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_URL }}
